<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>无障碍修正后实验页</title>
  <style>body{font-family:Arial,"Microsoft YaHei",sans-serif;margin:40px;color:#29443d;background:#fff}.card{max-width:520px;padding:20px;border:1px solid #b9cdc6;border-radius:12px}img{width:72px}label{display:block;font-weight:700;margin:12px 0 4px}input{padding:8px;border:1px solid #58736b}button{padding:8px 12px;color:#fff;background:#0b6a53;border:0;border-radius:4px}:focus-visible{outline:3px solid #d28a00;outline-offset:3px}</style>
</head>
<body>
  <main class="card">
    <h1>学习空间搜索</h1>
    <img src="../assets/img/logo.svg" alt="云大学习空间助手标志">
    <label for="q">地点名称</label>
    <div><input id="q" placeholder="例如：图书馆"><button type="button" aria-pressed="false">收藏空间</button></div>
    <h2>查询说明</h2>
    <p>修正页补上语言、图片替代文本、表单标签、按钮名称和连续标题层级，并提高文字对比度。</p>
  </main>
