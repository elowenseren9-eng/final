<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="新增、修改、筛选和导出个人学习计划。"><title>学习计划｜云大学习空间助手</title>
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="libs/bootstrap-5.3.8.min.css"><link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="plans">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header"><nav class="navbar navbar-expand-lg" aria-label="主导航"><div class="container"><a class="navbar-brand" href="index.html"><img src="assets/img/logo.svg" alt=""><span>云大学习空间助手</span></a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="展开导航"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1"><li class="nav-item"><a class="nav-link" data-nav="home" href="index.html">首页</a></li><li class="nav-item"><a class="nav-link" data-nav="spaces" href="spaces.html">空间查询</a></li><li class="nav-item"><a class="nav-link" data-nav="plans" href="plans.html">学习计划</a></li><li class="nav-item"><a class="nav-link" data-nav="insights" href="insights.html">数据洞察</a></li><li class="nav-item"><a class="nav-link" data-nav="campus" href="campus.html">三维校园</a></li><li class="nav-item ms-lg-2"><button class="btn btn-sm theme-button" id="themeToggle" type="button" aria-pressed="false">◐ 夜间</button></li></ul></div></div></nav></header>

  <main id="main">
    <section class="page-hero"><div class="container"><p class="eyebrow">My study plan</p><h1>学习计划板</h1><p>在浏览器中保存学习事项，支持新增、修改、标记完成、筛选、导出和导入。刷新页面后记录仍然保留。</p></div></section>
    <div class="page-main"><div class="container">
      <div id="planStatus" class="status-banner mb-4" role="status" aria-live="polite">计划功能已经就绪。</div>
      <div class="row g-4">
        <div class="col-lg-4"><section class="panel position-sticky" style="top:6.5rem" aria-labelledby="planFormTitle">
          <h2 id="planFormTitle">添加一项计划</h2><p class="result-meta">带 * 的内容必须填写。</p>
          <form id="planForm" novalidate><input id="planId" type="hidden">
            <div class="mb-3"><label class="form-label" for="planTitle">计划内容 *</label><input class="form-control" id="planTitle" maxlength="40" required placeholder="例如：复习 JavaScript 事件"></div>
            <div class="row g-2 mb-3"><div class="col-7"><label class="form-label" for="planDate">日期 *</label><input class="form-control" id="planDate" type="date" required></div><div class="col-5"><label class="form-label" for="planMinutes">时长</label><input class="form-control" id="planMinutes" type="number" min="15" max="720" step="15" value="60"></div></div>
            <div class="mb-3"><label class="form-label" for="planPlace">学习地点</label><select class="form-select" id="planPlace"><option value="待决定">待决定</option></select></div>
            <div class="row g-2 mb-3"><div class="col-7"><label class="form-label" for="planCategory">类别</label><select class="form-select" id="planCategory"><option>课程复习</option><option>项目实践</option><option>阅读写作</option><option>考研备考</option><option>其他</option></select></div><div class="col-5"><label class="form-label" for="planPriority">优先级</label><select class="form-select" id="planPriority"><option>普通</option><option>重要</option><option>紧急</option></select></div></div>
            <div class="mb-3"><label class="form-label" for="planNote">备注</label><textarea class="form-control" id="planNote" rows="3" maxlength="120" placeholder="可留空"></textarea></div>
            <p class="text-danger" id="planFormError" role="alert"></p>
            <div class="d-flex gap-2"><button class="btn btn-brand flex-grow-1" type="submit">保存计划</button><button class="btn btn-outline-secondary" id="cancelPlanEdit" type="button">重置</button></div>
          </form>
        </section></div>

        <div class="col-lg-8">
          <section class="panel mb-4" aria-labelledby="planOverviewTitle"><div class="d-flex flex-wrap justify-content-between gap-3 align-items-start"><div><h2 id="planOverviewTitle">完成进度</h2><p class="result-meta mb-2"><span id="planDone">0</span> 项已完成，<span id="planPending">0</span> 项待完成</p></div><div class="d-flex flex-wrap gap-2"><button class="btn btn-outline-brand btn-sm" id="exportPlans" type="button">导出 JSON</button><label class="btn btn-outline-brand btn-sm mb-0" for="importPlans">导入 JSON</label><input class="visually-hidden" id="importPlans" type="file" accept="application/json,.json"></div></div><div class="progress" role="progressbar" aria-label="计划完成进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-bar" id="planProgress" style="width:0%"></div></div></section>

          <section class="panel" aria-labelledby="planListTitle"><div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><h2 class="mb-0" id="planListTitle">计划列表</h2><div class="btn-group" role="group" aria-label="计划状态筛选"><button class="btn btn-sm btn-brand" type="button" data-plan-filter="all">全部</button><button class="btn btn-sm btn-outline-brand" type="button" data-plan-filter="pending">待完成</button><button class="btn btn-sm btn-outline-brand" type="button" data-plan-filter="done">已完成</button></div></div><ul class="task-list" id="planList"></ul></section>
        </div>
      </div>
    </div></div>
  </main>
  <footer class="site-footer"><div class="container d-flex flex-wrap justify-content-between gap-2"><span>© <span data-current-year></span> 云大学习空间助手</span><a href="spaces.html">先查询空间</a></div></footer>
  <script src="libs/bootstrap-5.3.8.bundle.min.js" defer></script><script src="libs/jquery-3.7.1.min.js" defer></script><script src="assets/js/common.js" defer></script><script src="assets/js/plans.js" defer></script>
</body>
</html>
